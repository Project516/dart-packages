name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  packages:
    name: format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pure Dart packages
        run: |
          set -euo pipefail
          for pkg in tba_client statbotics_client match13_client firestore_client; do
            echo "::group::$pkg"
            (
              cd "packages/$pkg"
              dart pub get
              dart format --output=none --set-exit-if-changed .
              dart analyze --fatal-infos
              dart test
            )
            echo "::endgroup::"
          done

      - name: Flutter plugin packages
        run: |
          set -euo pipefail
          for pkg in liquid_glass apple_ai apple_web_auth; do
            echo "::group::$pkg"
            (
              cd "packages/$pkg"
              flutter pub get
              dart format --output=none --set-exit-if-changed .
              flutter analyze --fatal-infos
              flutter test
            )
            echo "::endgroup::"
          done

  ios:
    name: build ios (${{ matrix.package }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # needle is a string the plugin's Swift puts in the binary, so the
          # verify step proves the code landed and not just that a build passed.
          - package: liquid_glass
            plugin_class: LiquidGlassPlugin
            needle: dev.project516.liquid_glass/view
          - package: apple_ai
            plugin_class: AppleAiPlugin
            needle: dev.project516.apple_ai
            # Proves the SDK had FoundationModels (`#if canImport` otherwise
            # compiles a stub) and that it is linked weakly, so an older iOS
            # still launches the app.
            weak_framework: FoundationModels
          - package: apple_web_auth
            plugin_class: AppleWebAuthPlugin
            needle: dev.project516.apple_web_auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build the example unsigned
        working-directory: packages/${{ matrix.package }}/example
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      # A build can succeed while the plugin is absent, so check it was linked.
      - name: Verify the plugin was linked in
        working-directory: packages/${{ matrix.package }}/example
        env:
          PLUGIN_CLASS: ${{ matrix.plugin_class }}
          NEEDLE: ${{ matrix.needle }}
          WEAK_FRAMEWORK: ${{ matrix.weak_framework }}
        run: |
          set -euo pipefail

          registrant="$(find ios -name 'GeneratedPluginRegistrant.m' | head -1)"
          if [ -z "$registrant" ]; then
            echo "GeneratedPluginRegistrant not found; pub did not wire the plugin" >&2
            exit 1
          fi
          if ! grep -q "$PLUGIN_CLASS" "$registrant"; then
            echo "$PLUGIN_CLASS absent from $registrant" >&2
            cat "$registrant" >&2
            exit 1
          fi
          echo "registrant registers $PLUGIN_CLASS"

          app="$(find build/ios -type d -name Runner.app | head -1)"
          if [ -z "$app" ]; then
            echo "Runner.app not found" >&2
            exit 1
          fi
          if ! strings -a "$app/Runner" | grep -q "$NEEDLE"; then
            echo "'$NEEDLE' is not in the built binary" >&2
            exit 1
          fi
          echo "'$NEEDLE' present in the binary"

          if [ -n "${WEAK_FRAMEWORK:-}" ]; then
            xcodebuild -version
            cmds="$(otool -l "$app/Runner")"
            if ! printf '%s\n' "$cmds" | grep -q "$WEAK_FRAMEWORK"; then
              echo "$WEAK_FRAMEWORK is not linked, so the SDK lacked it and the stub was compiled." >&2
              exit 1
            fi
            # otool -L cannot tell weak from required; the load commands can.
            if printf '%s\n' "$cmds" | grep -A3 LC_LOAD_WEAK_DYLIB \
              | grep -q "$WEAK_FRAMEWORK"; then
              echo "$WEAK_FRAMEWORK is weak linked"
            else
              echo "$WEAK_FRAMEWORK is linked as required, not weakly." >&2
              echo "Fix: s.weak_frameworks in the podspec." >&2
              exit 1
            fi
          fi

  macos:
    name: build macos (${{ matrix.package }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [liquid_glass, apple_ai, apple_web_auth]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build the example
        working-directory: packages/${{ matrix.package }}/example
        run: |
          flutter pub get
          flutter build macos --release
